name: Bug report
description: Report a reproducible problem in MailMate
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, or private email/calendar content.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch or commit
      placeholder: main or a commit SHA
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove all secrets and personal content before attaching anything.

